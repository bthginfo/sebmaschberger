name: Starter checks
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'skills/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'skills/**'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify the production CMS workflow
        shell: bash
        run: |
          node scripts/configure-auth.mjs --generate
          npm run start > .data/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 http://localhost:3000/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            tail -n 80 .data/server.log
            exit 1
          fi
          node scripts/verify-local.mjs http://localhost:3000
